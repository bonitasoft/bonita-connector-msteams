connectorDefinitionLabel=MS Teams - Upload File
connectorDefinitionDescription=Upload a file to a Microsoft Teams channel.
msteams.category=MS Teams
connectionPage.pageTitle=Connection Settings
operationPage.pageTitle=File Upload Details
tenantIdWidget.label=Tenant ID *
tenantIdWidget.description=Azure AD tenant ID (directory ID).
clientIdWidget.label=Client ID *
clientIdWidget.description=Azure AD application (client) ID.
clientSecretWidget.label=Client Secret *
clientSecretWidget.description=Azure AD client secret value.
authModeWidget.label=Auth Mode (Optional)
authModeWidget.description=Authentication mode: APP_ONLY (default) or DELEGATED.
refreshTokenWidget.label=Refresh Token (Optional)
refreshTokenWidget.description=OAuth 2.0 refresh token. Required for DELEGATED mode.
userIdWidget.label=User ID (Optional)
userIdWidget.description=User ID or UPN. Not required for file upload.
connectTimeoutWidget.label=Connect Timeout (ms)
connectTimeoutWidget.description=Connection timeout in milliseconds. Default: 30000.
readTimeoutWidget.label=Read Timeout (ms)
readTimeoutWidget.description=Read timeout in milliseconds. Default: 60000.
teamIdWidget.label=Team ID *
teamIdWidget.description=ID of the Microsoft Teams team.
channelIdWidget.label=Channel ID *
channelIdWidget.description=ID of the channel to upload the file to.
fileNameWidget.label=File Name *
fileNameWidget.description=Name for the uploaded file (max 255 characters). Example: "Report_2024.pdf".
fileContentWidget.label=File Content (Base64) *
fileContentWidget.description=File content encoded in Base64. Use a Groovy script to convert documents.
contentTypeWidget.label=Content Type (Optional)
contentTypeWidget.description=MIME type of the file (e.g. "application/pdf"). Default: application/octet-stream.
