name: Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'XML'
          <settings>
            <servers>
              <server>
                <id>bonitasoft-releases</id>
                <username>${env.JFROG_USER}</username>
                <password>${env.JFROG_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XML
        env:
          JFROG_USER: ${{ secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}

      - name: Build & Unit Tests
        run: |
          if [ -n "$JFROG_USER" ]; then
            mvn clean verify -DskipITs
          else
            echo "JFrog credentials not available, excluding -all module (BTT tests)"
            mvn clean verify -DskipITs -pl '!bonita-connector-msteams-all'
          fi
        env:
          JFROG_USER: ${{ secrets.JFROG_USER }}

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/'

  integration-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'XML'
          <settings>
            <servers>
              <server>
                <id>bonitasoft-releases</id>
                <username>${env.JFROG_USER}</username>
                <password>${env.JFROG_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XML
        env:
          JFROG_USER: ${{ secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}

      - name: Integration Tests
        if: ${{ secrets.JFROG_USER != '' }}
        run: mvn verify -pl bonita-connector-msteams-all -am -DskipTests -Dfailsafe.groups=integration
