connectorDefinitionLabel=MS Teams - Create Meeting
connectorDefinitionDescription=Create an online meeting in Microsoft Teams.
msteams.category=MS Teams
connectionPage.pageTitle=Connection Settings
operationPage.pageTitle=Meeting Details
tenantIdWidget.label=Tenant ID *
tenantIdWidget.description=Azure AD tenant ID (directory ID).
clientIdWidget.label=Client ID *
clientIdWidget.description=Azure AD application (client) ID.
clientSecretWidget.label=Client Secret *
clientSecretWidget.description=Azure AD client secret value.
authModeWidget.label=Auth Mode (Optional)
authModeWidget.description=Authentication mode: APP_ONLY (default) or DELEGATED.
refreshTokenWidget.label=Refresh Token (Optional)
refreshTokenWidget.description=OAuth 2.0 refresh token. Required for DELEGATED mode.
userIdWidget.label=User ID *
userIdWidget.description=User ID or UPN of the meeting organizer.
connectTimeoutWidget.label=Connect Timeout (ms)
connectTimeoutWidget.description=Connection timeout in milliseconds. Default: 30000.
readTimeoutWidget.label=Read Timeout (ms)
readTimeoutWidget.description=Read timeout in milliseconds. Default: 60000.
subjectWidget.label=Subject *
subjectWidget.description=Meeting subject / title.
startDateTimeWidget.label=Start Date/Time *
startDateTimeWidget.description=Meeting start time in ISO 8601 format (e.g. 2024-01-15T10:00:00Z).
endDateTimeWidget.label=End Date/Time *
endDateTimeWidget.description=Meeting end time in ISO 8601 format (e.g. 2024-01-15T11:00:00Z).
allowedPresentersWidget.label=Allowed Presenters (Optional)
allowedPresentersWidget.description=Who can present: everyone (default), organization, roleIsPresenter, organizer.
lobbyBypassScopeWidget.label=Lobby Bypass Scope (Optional)
lobbyBypassScopeWidget.description=Who can bypass the lobby: organization (default), everyone, organizer, invited.
recordAutomaticallyWidget.label=Record Automatically
recordAutomaticallyWidget.description=Whether to automatically record the meeting. Default: false.
